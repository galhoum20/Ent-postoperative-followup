name: Build Android APK (V12)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - V12-build
    paths:
      - 'index.html'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'package.json'
      - 'capacitor.config.json'
      - 'patch-manifest.py'
      - '.github/workflows/build-android-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Copy web files into www
        run: |
          mkdir -p www
          cp index.html sw.js manifest.webmanifest icon-192.png icon-512.png www/

      - name: Add and sync Android platform
        run: |
          npx cap add android
          npx cap sync android

      - name: Add notification permissions to manifest
        run: python3 patch-manifest.py

      - name: Install fixed signing key
        env:
          KS_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            for D in "$HOME/.android" "$HOME/.config/.android"; do
              mkdir -p "$D"
              echo "$KS_B64" | base64 -d > "$D/debug.keystore"
            done
            echo "Using the fixed signing key from GitHub Secrets"
          else
            echo "WARNING: secret ANDROID_DEBUG_KEYSTORE_BASE64 not set. A random key will be used."
          fi

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Print APK signing SHA-1
        continue-on-error: true
        run: |
          for K in /home/runner/.config/.android/debug.keystore /home/runner/.android/debug.keystore; do
            [ -f "$K" ] && keytool -list -v -keystore "$K" -alias androiddebugkey -storepass android -keypass android 2>&1 | grep -E "SHA1|SHA-1"
          done || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AlFereh-ENT-Followup-V12-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
